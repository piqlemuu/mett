<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mett. — METHOD VAULT v2.2.1</title><style>*{box-sizing:border-box}body{margin:0;background:#f0ede6;color:#29352f;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:48px;letter-spacing:-4px;margin:0;line-height:1}small{color:#68766a}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit;border:1px solid #c9cec3;border-radius:8px;padding:10px;background:#faf9f6;color:inherit}button{cursor:pointer}button:hover,.active{background:#29352f;color:white}input,select,textarea{width:100%}textarea{min-height:180px} .tiles,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.tile,.item,section{background:#faf9f6;border:1px solid #d7d9d0;border-radius:12px;padding:18px}.tile{cursor:pointer}.tile:nth-child(2){background:#e2d9ea}.tile:nth-child(3){background:#e6dccd}.tile:nth-child(4){background:#dce2e7}.tile:first-child{background:#dde3d5}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:16px 0}.item h3{margin:8px 0}.item p{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}dialog{width:min(800px,95vw);max-height:90vh;border:1px solid #a9b5a1;border-radius:12px;background:#faf9f6;color:inherit;padding:24px}dialog::backdrop{background:#29352f88}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}footer{padding:24px;text-align:center}label{display:block;margin:8px 0}@media(max-width:600px){header{display:block}nav{margin-top:16px}.filters{grid-template-columns:1fr}main,header{padding:16px}}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #829c89;outline-offset:2px}button{min-height:44px}dialog{overflow:auto}textarea{font-size:16px} @media(max-width:600px){.cards,.tiles{grid-template-columns:1fr}nav button{flex:1 0 auto}dialog{padding:16px}input,select{font-size:16px}}
html{width:100%;max-width:100%;-webkit-text-size-adjust:100%}body{width:100%;max-width:100%;overflow-wrap:anywhere}header,main,footer{width:100%;min-width:0}header>div,nav,.cards,.tiles,.filters,.item,section,dialog{min-width:0;max-width:100%}input,select,textarea,pre{min-width:0;max-width:100%}.cards,.tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}pre{word-break:break-word}button{white-space:normal} @media(max-width:700px){body{font-size:16px;line-height:1.65}header,main{padding:16px}header{display:block}h1{font-size:40px}h2{font-size:21px;line-height:1.35}h3{font-size:17px;line-height:1.45}small{font-size:12px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:16px}nav button{font-size:13px;padding:8px 4px;min-width:0;min-height:44px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:14px;font-size:13px}.tile h2{font-size:18px;margin:0 0 8px}.cards,.filters{grid-template-columns:minmax(0,1fr)}.item,section{padding:14px}.item p{font-size:15px}.actions{gap:6px}.actions button{flex:1 1 auto}input,select,textarea{font-size:16px}dialog{width:calc(100% - 20px);max-width:calc(100% - 20px);max-height:85dvh;padding:16px;margin:auto}footer{font-size:12px;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}}
</style><header><div><h1>mett.</h1><small>METHOD VAULT</small></div><nav id="nav"></nav></header><main id="main"></main><dialog id="detail"></dialog><footer>Collect. Refine. Reuse. · v2.2.1 · 개인 기기 저장 방식 · 정기 백업 권장</footer><script id="seed" type="application/json">{"skills": [], "originals": [], "pending": [], "version": "1.9"}</script><script>
const seed=JSON.parse(document.querySelector('#seed').textContent), $=s=>document.querySelector(s);let db=structuredClone(seed), saved=[], history=[], mix=[], page='Home', q='',cat='',status='';try{let s=JSON.parse(localStorage.getItem('mett-v2'));if(s){db=s.db;saved=s.saved||[];history=s.history||[];mix=s.mix||[]}}catch(e){} const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem('mett-v2',JSON.stringify({db,saved,history,mix}));return true}catch(e){alert('기기 저장 실패. 백업을 내보내세요.');return false}}function go(p){page=p;render()}function copy(t){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).catch(()=>fallback(t));else fallback(t)}function fallback(t){let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();if(!document.execCommand('copy'))alert('자동 복사 실패: 텍스트를 직접 선택하세요.');a.remove()}function find(id){return db.skills.find(s=>s.id===id)}function card(s){return `<article class="item"><small>${esc(s.category)} · ${esc(s.status)}</small><h3>${esc(s.title)}</h3><p>${esc(s.prompt)}</p><div class="actions"><button onclick="openSkill('${esc(s.id)}')">열기</button><button onclick="toggle('${esc(s.id)}')">${saved.includes(s.id)?'★':'☆'}</button><button onclick="addMix('${esc(s.id)}')">Forge +</button></div></article>`}function toggle(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();render()}function addMix(id){if(!mix.includes(id))mix.push(id);persist();alert('Forge에 추가됨')}function options(vals,v){return vals.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function render(){ $('#nav').innerHTML=['Home','Library','New','Forge','SyntaxLab','Chronicle','Saved','Categories','Trash','Vault'].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${({Home:'홈',Library:'라이브러리',New:'새 스킬',Forge:'Forge',SyntaxLab:'실험실',Chronicle:'수정 이력',Saved:'즐겨찾기',Categories:'카테고리',Trash:'휴지통',Vault:'백업'})[p]}</button>`).join('');let m=$('#main');if(page==='Home'){m.innerHTML=`<h2>만드는 방법도 자산이니까.</h2><p>처음 사용한다면 Vault에서 개인 JSON을 가져오세요. 데이터는 이 브라우저에만 저장됩니다.</p><button onclick="go('Vault')">JSON 가져오기</button><p>${db.skills.length} SKILLS · ${new Set(db.skills.map(s=>s.category)).size} CATEGORIES · ${db.originals.length} ORIGINAL FILES</p><input placeholder="스킬 검색" oninput="q=this.value;go('Library')"><div class="tiles" style="margin-top:20px">${[['Library','Grimoire','스킬 라이브러리'],['Forge','Forge','프롬프트 조합'],['SyntaxLab','SyntaxLab','수정 및 실험'],['Chronicle','Chronicle','버전과 변경 이력']].map(a=>`<div class="tile" onclick="go('${a[0]}')"><h2>${a[1]}</h2>${a[2]}</div>`).join('')}</div><h2>MY LIBRARY</h2><div class="cards">${db.skills.filter(s=>!s.deleted).slice(0,6).map(card).join('')}</div>`}else if(page==='Library'||page==='Saved'){m.innerHTML=`<h2>${page==='Library'?'Grimoire':'Saved'}</h2><div class="filters"><input id="q" placeholder="제목·본문·태그 검색" value="${esc(q)}"><select id="cat"><option value="">전체 카테고리</option>${options(categories(),cat)}</select><select id="status"><option value="">전체 상태</option>${options([...new Set(db.skills.map(s=>s.status))],status)}</select></div><small id="count"></small><div class="cards" id="results"></div>`;for(let k of ['q','cat','status'])$('#'+k).oninput=filter;filter()}else if(page==='Forge'){m.innerHTML=`<h2>Forge</h2><p>선택한 프롬프트 전문을 순서대로 결합합니다. 충돌 여부는 직접 검토하세요.</p><select id="pick">${db.skills.filter(s=>!s.deleted).map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('')}</select><button onclick="addMix($('#pick').value);render()">추가</button><div>${mix.map((id,i)=>`<section>${esc(find(id)?.title)} <button onclick="move(${i},-1)">↑</button><button onclick="move(${i},1)">↓</button><button onclick="mix.splice(${i},1);persist();render()">제거</button></section>`).join('')}</div><textarea id="combined">${esc(mix.map(id=>find(id)?.prompt||'').join('\n\n---\n\n'))}</textarea><button onclick="copy($('#combined').value)">복사</button> <button onclick="if(confirm('조합 목록을 비울까요?')){mix=[];persist();render()}">조합 초기화</button>`}else if(page==='New'||page==='SyntaxLab'){m.innerHTML=`<h2>${page}</h2>${page==='SyntaxLab'?`<select onchange="if(this.value)openSkill(this.value)"><option value="">수정할 스킬 선택</option>${db.skills.filter(s=>!s.deleted).map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('')}</select><p>기존 스킬을 열어 편집하거나 새 실험을 등록하세요.</p>`:''}<label>제목<input id="nt"></label><label>카테고리<input id="nc" value="CUSTOM"></label><label>태그 (쉼표 구분)<input id="newtags"></label><label>호출 명령어<input id="newcommand"></label><label>프롬프트<textarea id="np"></textarea></label><button onclick="create()">새 스킬 저장</button>`}else if(page==='Chronicle'){m.innerHTML=`<h2>Chronicle</h2><p>기초 데이터 v${esc(seed.version)} · 수정 이력 ${history.length}개</p>${history.map((h,i)=>`<section>${esc(h.date)} · ${esc(h.skill.title)} <button onclick="compareVersion(${i})">비교</button> <button onclick="restore(${i})">이 버전 복원</button></section>`).join('')}<h3>미확보 원본</h3><pre>${esc((seed.pending||seed.audit?.pending_originals||[]).join('\n'))}</pre>`}else if(page==='Categories'){m.innerHTML=`<h2>카테고리 관리</h2><label>새 카테고리<input id="newcat"></label><button onclick="addCategory()">추가</button><div>${categories().map((c,i)=>`<section>${esc(c)} · ${db.skills.filter(s=>s.category===c&&!s.deleted).length}개 <button onclick="renameCategory(${i})">이름 변경</button></section>`).join('')}</div>`}else if(page==='Trash'){m.innerHTML=`<h2>휴지통</h2><p>삭제한 스킬은 백업에 보존됩니다.</p>${db.skills.filter(s=>s.deleted).map(s=>`<section>${esc(s.title)} <button onclick="recoverSkill('${esc(s.id)}')">복원</button></section>`).join('')}`}else{m.innerHTML=`<h2>Vault</h2><p>원본 목록 및 전체 데이터 백업</p><button onclick="download()">JSON 백업 내보내기</button><label>JSON 가져오기<input type="file" accept=".json" onchange="importData(this.files[0])"></label><pre>${esc(db.originals.map(o=>o.path).join('\n'))}</pre><p>원본 파일 자체는 별도 아카이브 ZIP에 보존됩니다.</p>`}}
function filter(){q=$('#q').value;cat=$('#cat').value;status=$('#status').value;let a=db.skills.filter(s=>!s.deleted&&(page!=='Saved'||saved.includes(s.id))&&(!cat||s.category===cat)&&(!status||s.status===status)&&JSON.stringify(s).toLowerCase().includes(q.toLowerCase()));$('#count').textContent=a.length+'개';$('#results').innerHTML=a.map(card).join('')}function categories(){return [...new Set([...(db.categories||[]),...db.skills.map(s=>s.category)])].sort()}
function addCategory(){let c=$('#newcat').value.trim();if(!c)return;db.categories=[...new Set([...categories(),c])];persist();render()}
function snapshot(s){history.push({date:new Date().toISOString(),skill:structuredClone(s)})}
function renameCategory(i){let old=categories()[i],n=prompt('새 카테고리 이름',old)?.trim();if(!n||n===old)return;if(categories().includes(n)&&!confirm('기존 카테고리로 합칠까요?'))return;db.categories=[...new Set(categories().map(c=>c===old?n:c))];db.skills.filter(s=>s.category===old).forEach(s=>{snapshot(s);s.category=n});if(cat===old)cat=n;persist();render()}
function openSkill(id){let s=find(id);if(!s)return;$('#detail').innerHTML=`<button onclick="$('#detail').close()">닫기</button><h2>${esc(s.title)}</h2><small>${esc(s.id)} · ${esc(s.status)} · ${esc(s.version)}</small><p>${esc(s.source)}</p><label>제목<input id="et" value="${esc(s.title)}"></label><label>카테고리<input id="ec" list="categorylist" value="${esc(s.category)}"><datalist id="categorylist">${options(categories(),'')}</datalist></label><label>태그<input id="eg" value="${esc((s.tags||[]).join(', '))}"></label><label>호출 명령어<input id="em" value="${esc(s.command)}"></label><label>프롬프트<textarea id="edit" style="min-height:350px">${esc(s.prompt)}</textarea></label><div class="actions"><button onclick="copy($('#edit').value)">복사</button><button onclick="editSkill('${id}')">수정본 저장</button><button onclick="duplicateSkill('${id}')">복제</button><button onclick="trashSkill('${id}')">휴지통 이동</button>${['txt','md','json'].map(ext=>`<button onclick="exportSkill('${id}','${ext}')">${ext.toUpperCase()}</button>`).join('')}</div><p>동일 제목 또는 프롬프트: ${db.skills.filter(x=>x.id!==id&&!x.deleted&&(x.title.trim().toLowerCase()===s.title.trim().toLowerCase()||x.prompt.trim()===s.prompt.trim())).length}개</p>`;if(!$('#detail').open)$('#detail').showModal()}
function editSkill(id){let s=find(id),title=$('#et').value.trim(),prompt=$('#edit').value;if(!title||!prompt.trim())return alert('제목과 프롬프트를 입력하세요.');snapshot(s);Object.assign(s,{title,prompt,category:$('#ec').value.trim()||'CUSTOM',tags:$('#eg').value.split(',').map(t=>t.trim()).filter(Boolean),command:$('#em').value,status:'EDITED',version:(s.version||'1.0')+'+edit'});if(persist()){$('#detail').close();render()}}
function duplicateSkill(id){let s=structuredClone(find(id));s.parent_id=id;s.id='USER-'+crypto.randomUUID();s.title+=' (복제)';s.status='USER';s.version='1.0';db.skills.push(s);persist();openSkill(s.id);render()}
function trashSkill(id){if(!confirm('휴지통으로 이동할까요?'))return;let s=find(id);snapshot(s);s.deleted=true;persist();$('#detail').close();render()}
function recoverSkill(id){let s=find(id);snapshot(s);delete s.deleted;persist();render()}
function exportSkill(id,ext){let s=find(id),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ext==='json'?JSON.stringify(s,null,2):ext==='md'?'# '+s.title+'\n\n'+s.prompt:s.prompt],{type:ext==='json'?'application/json':'text/plain'}));a.download=s.id+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function compareVersion(i){let h=history[i],s=find(h.skill.id);$('#detail').innerHTML=`<button onclick="$('#detail').close()">닫기</button><h2>수정 전후 비교</h2><div class="tiles"><section><h3>이전</h3><pre>${esc(JSON.stringify(h.skill,null,2))}</pre></section><section><h3>현재</h3><pre>${esc(JSON.stringify(s,null,2))}</pre></section></div>`;$('#detail').showModal()}
function restore(i){let h=history[i],s=find(h.skill.id);if(!s)return;history.push({date:new Date().toISOString(),skill:structuredClone(s)});db.skills[db.skills.indexOf(s)]=structuredClone(h.skill);persist();render()}function create(){let title=$('#nt').value.trim(),prompt=$('#np').value;if(!title||!prompt.trim())return alert('제목과 프롬프트를 입력하세요.');db.skills.push({id:'USER-'+Date.now(),title,prompt,category:$('#nc').value||'CUSTOM',status:'USER',version:'1.0',type:'SKILL',tags:$('#newtags').value.split(',').map(t=>t.trim()).filter(Boolean),command:$('#newcommand').value});persist();go('Library')}function move(i,d){let j=i+d;if(j<0||j>=mix.length)return;[mix[i],mix[j]]=[mix[j],mix[i]];persist();render()}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({db,saved,history,mix},null,2)],{type:'application/json'}));a.download='mett_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function importData(f){if(!f)return;try{let x=JSON.parse(await f.text()),d=x.db||x;if(!Array.isArray(d.skills)||!Array.isArray(d.originals)||!d.skills.every(s=>typeof s.id==='string'&&typeof s.prompt==='string'&&s.prompt.trim())||new Set(d.skills.map(s=>s.id)).size!==d.skills.length)throw Error();if(!d.skills.every(s=>/^[A-Za-z0-9_-]+$/.test(s.id)&&typeof s.title==='string'&&typeof s.category==='string'&&typeof s.status==='string'))throw Error();if(!confirm(`가져올 스킬 ${d.skills.length}개 · 현재 ${db.skills.length}개 · 기존에만 있는 ID ${db.skills.filter(s=>!d.skills.some(t=>t.id===s.id)).length}개. 현재 데이터를 교체하며 기존 백업을 먼저 다운로드합니다.`))return;download();db=d;saved=Array.isArray(x.saved)?x.saved.filter(id=>d.skills.some(s=>s.id===id)):[];history=Array.isArray(x.history)?x.history.filter(h=>h&&h.skill&&typeof h.skill.id==='string'):[];mix=Array.isArray(x.mix)?x.mix.filter(id=>d.skills.some(s=>s.id===id)):[];persist();go('Library')}catch(e){alert('지원하지 않는 데이터 형식입니다.')}}render();</script></html>
